<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klima-Förderungen Deutschland · COzwei</title>
<style>
  :root {
    --green:#81B29A; --blue:#3D405B; --yellow:#F2CC8F; --beige:#F4F1DE; --orange:#E17960;
    --bg:#FBFAF6; --border:#E8E4D8; --text:#3D405B; --muted:#6B6E80;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.55}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 24px 80px}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:24px;flex-wrap:wrap}
  .title-block h1{margin:0 0 6px;font-size:26px;letter-spacing:-0.01em;color:var(--blue)}
  .title-block .sub{margin:0;font-size:14px;color:var(--muted);max-width:780px}
  .title-block .stand{margin-top:6px;font-size:12.5px;color:var(--muted)}

  .lang-switch{display:flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px;align-self:flex-start}
  .lang-btn{border:none;background:transparent;color:var(--blue);font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500}
  .lang-btn.active{background:var(--blue);color:#fff}

  /* ===== FAQ / Quiz Panel ===== */
  .faq-panel{background:linear-gradient(135deg,#FCFBF7 0%,#F4F1DE 100%);border:1px solid var(--yellow);border-radius:12px;padding:18px 22px;margin:18px 0 0}
  .faq-panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .faq-panel-header .left{flex:1;min-width:260px}
  .faq-panel-header h2{margin:0 0 4px;font-size:17px;color:var(--blue);letter-spacing:-0.005em}
  .faq-panel-header p{margin:0;font-size:13px;color:var(--text);line-height:1.5}
  .faq-panel-header .right{display:flex;gap:10px;align-items:center;flex-shrink:0}
  .btn-faq-start{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:inherit;letter-spacing:0.01em}
  .btn-faq-start:hover{background:#2A2C40}
  .btn-faq-start .ico{width:16px;height:16px}

  /* Quiz body (expanded state) */
  .faq-quiz{margin-top:18px;padding-top:18px;border-top:1px solid var(--yellow);display:none}
  .faq-quiz.open{display:block}
  .quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0.04em}
  .quiz-progress .step-bar{flex:1;margin:0 18px;height:4px;background:#fff;border-radius:2px;overflow:hidden}
  .quiz-progress .step-bar-fill{height:100%;background:var(--green);transition:width 0.25s ease}
  .quiz-close{background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:4px}
  .quiz-close:hover{color:var(--blue);background:rgba(0,0,0,0.04)}

  .quiz-question{font-size:18px;color:var(--blue);font-weight:600;margin:0 0 4px;line-height:1.35}
  .quiz-hint{font-size:12.5px;color:var(--muted);margin:0 0 14px;font-style:italic}

  .quiz-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:18px}
  .quiz-option{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;cursor:pointer;font-size:13px;color:var(--text);line-height:1.4;display:flex;align-items:center;gap:9px;text-align:left;font-family:inherit;transition:all 0.12s}
  .quiz-option:hover{border-color:#C9CFB5;background:#FAFAF5}
  .quiz-option.selected{border-color:var(--green);background:#F2F7F3;color:var(--blue);font-weight:600}
  .quiz-option .chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:#fff;transition:all 0.12s}
  .quiz-option .chk.radio{border-radius:50%}
  .quiz-option.selected .chk{border-color:var(--green);background:var(--green)}
  .quiz-option.selected .chk::after{content:'';width:8px;height:8px;background:#fff;border-radius:1px}
  .quiz-option.selected .chk.radio::after{border-radius:50%}

  .quiz-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .quiz-nav-left,.quiz-nav-right{display:flex;gap:8px;align-items:center}
  .btn-quiz{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:7px;border:1px solid transparent;cursor:pointer;font-family:inherit}
  .btn-quiz-secondary{background:#fff;color:var(--blue);border-color:var(--border)}
  .btn-quiz-secondary:hover{border-color:var(--blue)}
  .btn-quiz-primary{background:var(--blue);color:#fff}
  .btn-quiz-primary:hover{background:#2A2C40}
  .btn-quiz-primary:disabled{background:#C9CFB5;cursor:not-allowed}

  /* Quiz results */
  .quiz-results-header{font-size:18px;color:var(--blue);font-weight:600;margin:0 0 4px}
  .quiz-results-sub{font-size:13px;color:var(--muted);margin:0 0 14px}
  .quiz-answer-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
  .answer-chip{background:#fff;border:1px solid var(--border);font-size:11.5px;color:var(--blue);padding:3px 9px;border-radius:11px}
  .answer-chip .qlabel{color:var(--muted);font-weight:600;margin-right:4px}

  .results-tier{margin-bottom:16px}
  .results-tier-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:10px}
  .results-tier-h .dot{width:9px;height:9px;border-radius:50%}
  .results-tier.high .dot{background:var(--green)}
  .results-tier.medium .dot{background:var(--orange)}
  .results-tier.high .results-tier-h{color:var(--green)}
  .results-tier.medium .results-tier-h{color:var(--orange)}
  .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .result-card{background:#fff;border:1px solid var(--border);border-radius:9px;padding:13px 15px}
  .result-card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .result-card-h .name{font-size:14px;font-weight:600;color:var(--blue);line-height:1.3}
  .result-card-h .scope-pill{font-size:9.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:8px;color:#fff;white-space:nowrap}
  .scope-pill.bund{background:var(--blue)}
  .scope-pill.land{background:var(--green)}
  .result-card .personal-context{background:#F2F7F3;border-left:3px solid var(--green);border-radius:6px;padding:10px 12px;margin:8px 0 10px}
  .result-card .pc-title{font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
  .result-card .pc-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
  .result-card .pc-list li{font-size:12.5px;color:var(--text);line-height:1.45}
  .result-card .pc-key{font-weight:600;color:var(--blue);margin-right:4px}
  .result-card .pc-val{color:var(--text)}
  .result-card .rule-reason{margin-top:8px}
  .result-card .rr-title{font-size:10.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .result-card .rule-reason p{font-size:12.5px;color:var(--text);line-height:1.5;margin:0}
  .result-card .open-detail{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;color:#fff;background:var(--blue);border:none;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600}
  .result-card .open-detail:hover{background:#2A2C40}
  .results-empty{padding:18px;text-align:center;color:var(--muted);font-size:13.5px;background:#fff;border:1px dashed var(--border);border-radius:9px}

  /* ===== Filter bar ===== */
  .filter-bar{display:grid;grid-template-columns:280px 1fr;gap:12px;margin:18px 0 0;align-items:stretch}
  @media (max-width: 760px){.filter-bar{grid-template-columns:1fr}}
  .filter-group{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .filter-group .ico{width:18px;height:18px;color:var(--muted);flex-shrink:0}
  .filter-group label{font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase}
  .filter-group select{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);outline:none;font-family:inherit;cursor:pointer;padding:4px 0}
  .filter-group select:focus{outline:none}
  .filter-group input{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);outline:none;font-family:inherit;padding:4px 0}

  .active-filter{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .active-filter.hidden{display:none}
  .filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;padding:4px 8px 4px 12px;border-radius:14px;font-weight:600;font-size:12.5px}
  .filter-chip .x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;font-size:14px;line-height:1}
  .filter-chip .x:hover{background:rgba(255,255,255,0.3)}

  /* ===== Main grid ===== */
  .main-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:24px;margin-top:22px;align-items:start}
  @media (max-width: 1020px){.main-grid{grid-template-columns:1fr}}

  .left-col{min-width:0}
  .right-col{position:sticky;top:18px}
  @media (max-width: 1020px){.right-col{position:static}}

  .section-title{font-size:17px;color:var(--blue);margin:0 0 4px;letter-spacing:-0.005em}
  .section-sub{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  .section-divider{margin:32px 0 18px;border:0;border-top:1px solid var(--border)}

  /* ===== Programme list ===== */
  .prog-list{display:flex;flex-direction:column;gap:6px}
  .prog-item{background:#fff;border:1px solid var(--border);border-radius:9px;overflow:hidden;transition:border-color 0.15s,box-shadow 0.15s}
  .prog-item:hover{border-color:#C9CFB5}
  .prog-item.active{border-color:var(--green);box-shadow:0 2px 12px rgba(129,178,154,0.18)}
  .prog-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
  .prog-header:hover{background:#FAFAF5}
  .prog-item.active .prog-header{background:#F2F7F3}
  .ph-left{min-width:0;flex:1;display:flex;align-items:center;gap:8px}
  .ph-text{min-width:0;flex:1}
  .pname{font-size:13.5px;font-weight:600;color:var(--blue);line-height:1.3}
  .pbl{font-size:11.5px;color:var(--muted);margin-top:1px}
  .prog-pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap;letter-spacing:0.02em}
  .chev{width:14px;height:14px;color:var(--muted);transition:transform 0.2s;flex-shrink:0}
  .prog-item.active .chev{transform:rotate(180deg);color:var(--green)}

  /* ===== Inline detail ===== */
  .prog-detail{border-top:1px solid var(--border);padding:16px 16px 18px;background:#FCFBF7}
  .pd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .pd-head .full{font-size:13px;color:var(--muted);margin:0;flex:1;min-width:200px;line-height:1.45}
  .pd-badges{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .scope-badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:9px;letter-spacing:0.02em;white-space:nowrap}
  .scope-bund{background:var(--blue);color:#fff}
  .scope-land{background:var(--green);color:#fff}
  .source-badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:8px;letter-spacing:0.02em;white-space:nowrap;border:1px solid}
  .source-katalog{background:#FFF8EC;color:var(--blue);border-color:var(--yellow)}
  .source-weitere{background:#fff;color:var(--muted);border-color:var(--border)}

  .pd-sec{margin-top:12px}
  .pd-sec .lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:0.08em;margin-bottom:4px;text-transform:uppercase}
  .pd-sec .txt{font-size:13.5px;color:var(--text);line-height:1.55}
  .pd-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .pd-tag{font-size:11px;background:var(--beige);border-radius:9px;padding:2px 8px;color:var(--blue)}
  .pd-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:6px;text-decoration:none;border:1px solid transparent;cursor:pointer}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:#2A2C40}
  .btn-secondary{background:#fff;color:var(--blue);border-color:var(--border)}
  .btn-secondary:hover{border-color:var(--blue)}
  .btn-cozwei{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600}
  .btn-cozwei:hover{background:#C66043;border-color:#C66043}
  .cozwei-cta{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px}
  .cozwei-cta .cta-hint{font-size:10.5px;color:var(--muted);font-style:italic;padding-left:2px;letter-spacing:0.01em}
  .ext-ico{width:12px;height:12px}
  .pd-verified{font-size:11px;color:var(--muted);margin-top:10px}

  /* ===== Map sticky right ===== */
  .map-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
  .map-svg{width:100%;height:auto;display:block;max-height:75vh;transition:none}
  .map-svg .bl{cursor:pointer;stroke:#fff;stroke-width:0.6;transition:fill 0.15s ease,opacity 0.18s ease}
  .map-svg .bl:hover{stroke:var(--blue);stroke-width:1.2}
  .map-svg .bl.active{stroke:var(--blue);stroke-width:1.8}
  .map-svg .bl.dim{opacity:0.32}
  .map-svg .bl-lbl{font-family:inherit;font-size:14px;font-weight:600;fill:var(--blue);text-anchor:middle;dominant-baseline:middle;letter-spacing:0.02em;pointer-events:none}
  .map-svg .bl-lbl-sm{font-size:10px;font-weight:500}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);align-items:center}
  .legend .lg-title{font-weight:600;color:var(--blue);margin-right:4px}
  .legend .lg-item{display:flex;align-items:center;gap:5px}
  .legend .lg-sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,0.08)}

  .map-info{margin-top:14px;padding:12px 14px;background:#FCFBF7;border:1px solid var(--border);border-radius:9px;font-size:12.5px;color:var(--text);line-height:1.5}
  .map-info .mi-title{font-weight:600;color:var(--blue);margin-bottom:4px;font-size:13px}
  .map-info .mi-list{margin-top:6px;display:flex;flex-direction:column;gap:3px}
  .map-info .mi-list a{color:var(--blue);text-decoration:none;font-size:12.5px}
  .map-info .mi-list a:hover{text-decoration:underline}
  .map-info .mi-empty{color:var(--muted);font-style:italic}

  /* Disclaimer */
  .disclaimer{background:#FFF8EC;border:1px solid #F2CC8F;border-radius:12px;padding:16px 20px;margin-top:32px;font-size:13px;color:var(--blue);line-height:1.55}
  .disclaimer h4{margin:0 0 6px;font-size:13.5px;color:var(--blue)}
  .disclaimer p{margin:5px 0}
  .disclaimer a{color:var(--blue)}

  footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.55}
  footer .src-label{font-weight:600;color:var(--blue);margin-right:4px}
  footer a{color:var(--muted)}

  .no-match{font-size:13px;color:var(--muted);text-align:center;padding:14px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1 id="pageTitle"></h1>
      <p class="sub" id="pageSub"></p>
      <p class="stand" id="pageStand"></p>
    </div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <!-- ============ FAQ / Förderungsfinder ============ -->
  <div class="faq-panel" id="faqPanel">
    <div class="faq-panel-header">
      <div class="left">
        <h2 id="faqTitle"></h2>
        <p id="faqSub"></p>
      </div>
      <div class="right">
        <button class="btn-faq-start" id="faqStartBtn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="10 8 16 12 10 16 10 8"></polyline></svg>
          <span id="faqStartLabel"></span>
        </button>
      </div>
    </div>
    <div class="faq-quiz" id="faqQuiz"></div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <div style="display:flex;flex-direction:column;flex:1;min-width:0">
        <label id="filterBlLabel"></label>
        <select id="blFilter"></select>
      </div>
    </div>
    <div class="filter-group">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" autocomplete="off">
    </div>
  </div>
  <div class="active-filter hidden" id="activeFilterRow">
    <span id="activeFilterText"></span>
  </div>

  <!-- Main Grid -->
  <div class="main-grid">

    <!-- LEFT: Lists -->
    <div class="left-col">

      <!-- LANDESFÖRDERUNGEN (zuerst) -->
      <h2 class="section-title" id="landTitle"></h2>
      <p class="section-sub" id="landSub"></p>
      <div class="prog-list" id="landList"></div>

      <hr class="section-divider">

      <!-- BUNDESFÖRDERUNGEN (darunter) -->
      <h2 class="section-title" id="bundTitle"></h2>
      <p class="section-sub" id="bundSub"></p>
      <div class="prog-list" id="bundList"></div>

    </div>

    <!-- RIGHT: Map sticky -->
    <div class="right-col">

: "#81B29A", "mittel": "#A8C4B3", "basis": "#F2CC8F", "recherche": "#F4F1DE"}, "status_labels": {"hoch": {"de": "Hohe Förderdichte", "en": "High funding density"}, "mittel": {"de": "Mittlere Förderdichte", "en": "Medium funding density"}, "basis": {"de": "Basis-Programme", "en": "Base programmes"}, "recherche": {"de": "Detail-Recherche offen", "en": "Further research pending"}}, "prog_status_labels": {"aktiv": {"de": "Aktiv", "en": "Active"}, "frist-knapp": {"de": "Frist läuft", "en": "Deadline approaching"}, "geplant": {"de": "Geplant", "en": "Planned"}, "ausgesetzt": {"de": "Ausgesetzt", "en": "Suspended"}, "abgelaufen": {"de": "Antragsfrist beendet", "en": "Application period ended"}}, "prog_status_fill": {"aktiv": "#81B29A", "frist-knapp": "#E17960", "geplant": "#F2CC8F", "ausgesetzt": "#B0B0B0", "abgelaufen": "#888899"}, "bund_foerderungen": {"bafa4": {"name": "BAFA Modul 4", "fullName": {"de": "BAFA EEW Modul 4 – Energie- und ressourcenbezogene Optimierung von Anlagen und Prozessen", "en": "BAFA EEW Module 4 – Energy- and resource-related optimisation of equipment and processes"}, "content": {"de": "Die zentrale Bundesförderung für Investitionen in neue Maschinen und Anlagen zur Emissionseinsparung. Technologieoffen – fördert jede Investition, die nachweislich Treibhausgase einspart. Premiumförderung mit Förderung je vermiedener Tonne CO₂. Antrag über das FZD-Onlineportal (BAFA) oder als Kreditvariante über die KfW (Programm 295).", "en": "The central federal funding for investments in new machines and equipment that reduce emissions. Technology-open – funds any investment with demonstrable greenhouse gas savings. Premium funding based on €/t CO₂ avoided. Application via the FZD online portal (BAFA) or as loan variant via KfW (Programme 295)."}, "conditions": {"de": "De-Minimis: 45 % kleine / 35 % mittlere / 25 % große Unternehmen. AGVO: 20 % / 15 % / 10 %. Förderbegrenzung 2.600 €/t (klein) · 2.200 €/t (mittel) · 1.600 €/t (groß) eingesparte CO₂-Emissionen. Mindestens 30 % Emissionseinsparung oder absolut 100 t CO₂/a (KU) bzw. 300 t CO₂/a (MU). Bei AGVO beziehen sich die Sätze auf die Investitionsmehrkosten; Satz halbiert sich bei IGK.", "en": "De minimis: 45% small / 35% medium / 25% large companies. GBER: 20% / 15% / 10%. Funding cap €2,600 per t (small) / €2,200 per t (medium) / €1,600 per t (large) saved CO₂. At least 30% emission reduction or 100 t CO₂/a (small) or 300 t CO₂/a (medium) in absolute terms. Under GBER rates refer to additional investment costs; rate halved for IGK."}, "eligible": {"de": "Vornehmlich kleine und mittlere Unternehmen, mit Einsparkonzept; auch große Unternehmen förderfähig. Amortisationszeit über 3 Jahre. Energieeffizienzexperte (EEE) zwingend einzubinden.", "en": "Primarily small and medium-sized enterprises, with a savings concept; large companies also eligible. Payback period over 3 years. Energy efficiency expert (EEE) mandatory."}, "deadline": {"de": "Laufend. Antrag VOR Bestellung der Maschine über FZD-Onlineportal (BAFA) oder Hausbank/KfW. Programmlaufzeit der EEW-Richtlinie bis Ende 2026.", "en": "Ongoing. Application BEFORE ordering the machine via FZD online portal (BAFA) or house bank/KfW. EEW directive runtime until end of 2026."}, "reference": {"de": "BAnz AT 14.02.2024 B2 (EEW-Richtlinie vom 25.01.2024); Anlage zum Merkblatt Modul 4; Glossar-Update 01.04.2026. Quelle: COzwei Förderkatalog 10/2025.", "en": "BAnz AT 14.02.2024 B2 (EEW directive of 25 Jan 2024); annex to Module 4 leaflet; glossary update 01 Apr 2026. Source: COzwei funding catalogue 10/2025."}, "url": "https://www.bafa.de/DE/Energie/Energieeffizienz/Energieeffizienz_und_Prozesswaerme/Modul4_Energiebezogene_Optimierung_Basisfoerderung/modul4_energiebezogene_optimierung_basisfoerderung_node.html", "applyUrl": "https://www.foerderzentrale-deutschland.de/", "status": "aktiv", "source": "katalog", "tags": {"de": ["BAFA 4", "BAFA EEW", "Maschinen", "CO₂-Einsparung", "De-Minimis", "AGVO", "2.600 €/t", "Investition", "Energieeffizienzexperte", "KMU"], "en": ["BAFA 4", "BAFA EEW", "Machines", "CO₂ savings", "De minimis", "GBER", "€2,600/t", "Investment", "Energy efficiency expert", "SME"]}, "verified": "21.05.2026"}, "eew": {"name": "BAFA EEW", "fullName": {"de": "Bundesförderung für Energie- und Ressourceneffizienz in der Wirtschaft", "en": "Federal funding for energy and resource efficiency in industry"}, "content": {"de": "6-Modul-Förderung für Investitionen in Energie- und Ressourceneffizienz: Querschnittstechnologien (M1), Prozesswärme aus EE (M2), Mess-/Steuer-/Regeltechnik & EnMS (M3), technologieoffene Optimierung (M4), Transformationspläne (M5), Elektrifizierung Prozesswärme (M6). Zuschuss (BAFA) oder Kredit mit Tilgungszuschuss (KfW 295).", "en": "6-module funding for investments in energy and resource efficiency: cross-cutting technologies (M1), process heat from renewables (M2), measurement/control technology & EnMS (M3), technology-open optimisation (M4), transformation plans (M5), electrification of process heat (M6). Grant (BAFA) or loan with repayment subsidy (KfW 295)."}, "conditions": {"de": "M1: 20–25 % (KMU), max. 200.000 €. M2: 40–60 % (je Unternehmensgröße), max. 20 Mio. €. M3: 25–45 %, max. 20 Mio. €. M4 Basis: 10–15 %, max. 20 Mio. €. M4 Premium: bis 2.600 €/t CO₂eq. M5: 40–60 %, max. 60.000 € (90.000 € im EE-Netzwerk). M6: 33 % (nur Kleinst-/Kleinunternehmen), max. 200.000 €.", "en": "M1: 20–25% (SME), max €200k. M2: 40–60% (by size), max €20m. M3: 25–45%, max €20m. M4 base: 10–15%, max €20m. M4 premium: up to €2,600 per t CO₂eq. M5: 40–60%, max €60k (€90k in EE network). M6: 33% (only micro/small businesses), max €200k."}, "eligible": {"de": "Unternehmen aller Größen, Freiberufler, kommunale Unternehmen. Landwirte nur in M2 (Art. 41 AGVO).", "en": "Companies of all sizes, freelancers, municipal companies. Farmers only under M2 (Art. 41 GBER)."}, "deadline": {"de": "Laufend (Programmlaufzeit bis Ende 2026). Seit 15.09.2025 ausschließlich über das FZD-Onlineportal. Antrag vor Maßnahmenbeginn.", "en": "Ongoing (programme runtime until end of 2026). Since 15 Sep 2025 exclusively via the FZD online portal. Application before start of measures."}, "reference": {"de": "BAnz AT 14.02.2024 B2 (Richtlinie vom 25.01.2024); zuletzt Glossar-Update 01.04.2026.", "en": "BAnz AT 14.02.2024 B2 (Directive of 25 Jan 2024); last updated 01 Apr 2026 (glossary)."}, "url": "https://www.bafa.de/DE/Energie/Energieeffizienz/Energieeffizienz_und_Prozesswaerme/uebersicht_node.html", "applyUrl": "https://www.foerderzentrale-deutschland.de/", "status": "aktiv", "tags": {"de": ["Energieeffizienz", "BAFA", "Querschnittstechnologien", "Prozesswärme", "Transformationsplan", "KfW 295", "EnMS", "CO₂-Reduktion"], "en": ["Energy efficiency", "BAFA", "Cross-cutting technologies", "Process heat", "Transformation plan", "KfW 295", "EnMS", "CO₂ reduction"]}, "source": "weitere", "verified": "20.05.2026"}, "kfw295": {"name": "KfW 295", "fullName": {"de": "KfW-Bundesförderung für Energie- und Ressourceneffizienz in der Wirtschaft (Kreditvariante)", "en": "KfW federal funding for energy and resource efficiency in industry (loan variant)"}, "content": {"de": "Kreditvariante des EEW-Programms. Zinsgünstiges Darlehen für die gleichen 6 Module wie BAFA EEW – plus Tilgungszuschuss aus den Modul-spezifischen Quoten. Geeignet für größere Investitionsvolumina, bei denen ein Direktzuschuss limitiert wäre.", "en": "Loan variant of the EEW programme. Low-interest loan for the same 6 modules as BAFA EEW – plus repayment subsidy from module-specific rates. Suitable for larger investment volumes where a direct grant would be limited."}, "conditions": {"de": "Bis 100 % der förderfähigen Kosten als Darlehen, max. 25 Mio. € (in einzelnen Modulen bis 100 Mio. €). Tilgungszuschuss bis 65 % je nach Modul und Unternehmensgröße. Bereitstellungsprovision 0,15 %/Monat.", "en": "Up to 100% of eligible costs as loan, max €25m (up to €100m in individual modules). Repayment subsidy up to 65% depending on module and company size. Provision fee 0.15%/month."}, "eligible": {"de": "Gewerbliche Unternehmen, Einzelunternehmer, Freiberufler, Joint Ventures, kommunale Unternehmen.", "en": "Commercial enterprises, sole proprietors, freelancers, joint ventures, municipal companies."}, "deadline": {"de": "Laufend. Antragstellung über die Hausbank an die KfW.", "en": "Ongoing. Application via house bank to KfW."}, "reference": {"de": "KfW-Programm Nr. 295; identische Richtlinie wie BAFA EEW.", "en": "KfW programme no. 295; identical directive as BAFA EEW."}, "url": "https://www.kfw.de/inlandsfoerderung/Unternehmen/Energie-Umwelt/F%C3%B6rderprodukte/Energieeffizienz-und-Prozessw%C3%A4rme-aus-Erneuerbaren-Energien-(295)/", "applyUrl": "https://www.kfw.de/inlandsfoerderung/Unternehmen/Energie-Umwelt/F%C3%B6rderprodukte/Energieeffizienz-und-Prozessw%C3%A4rme-aus-Erneuerbaren-Energien-(295)/", "status": "aktiv", "tags": {"de": ["KfW", "Energieeffizienz", "Kredit", "Tilgungszuschuss", "Hausbank", "Großinvestition"], "en": ["KfW", "Energy efficiency", "Loan", "Repayment subsidy", "House bank", "Large investment"]}, "source": "weitere", "verified": "20.05.2026"}, "ccfd": {"name": "CCfD / Klimaschutzverträge", "fullName": {"de": "Förderrichtlinie CO₂-Differenzverträge (Klimaschutzverträge)", "en": "Funding directive for CO₂ differential contracts (Climate protection contracts)"}, "content": {"de": "Differenzverträge gleichen Mehrkosten klimaneutraler Produktionsverfahren gegenüber konventionellen Verfahren aus (CAPEX + OPEX). Bund zahlt Differenz zwischen festgelegtem Basispreis und EU-ETS-CO₂-Preis. Förderbar: grüner Wasserstoff, Elektrifizierung, CCU/CCS, Dampfsysteme.", "en": "Differential contracts compensate additional costs of climate-neutral production processes versus conventional methods (CAPEX + OPEX). Federal government pays difference between fixed base price and EU ETS CO₂ price. Eligible: green hydrogen, electrification, CCU/CCS, steam systems."}, "conditions": {"de": "Produktionsstandort in Deutschland; Referenzsystem >5 kt CO₂/Jahr; mind. 50 % CO₂-Reduktion nach 4 Jahren, 85 % im letzten Jahr; max. Fördersumme ab 15 Mio. €. Operativer Beginn bis spätestens 2031.", "en": "Production site in Germany; reference system >5 kt CO₂/year; min 50% CO₂ reduction after 4 years, 85% in final year; max grant from €15m. Operations to start by 2031."}, "eligible": {"de": "Emissionsintensive Industrie (Stahl, Zement, Chemie, Glas, Papier, etc.). Vorverfahren 2026 abgeschlossen – nur Teilnehmer dieses Vorverfahrens können in das Gebotsverfahren Mitte 2026 (~6 Mrd. €).", "en": "Emissions-intensive industry (steel, cement, chemicals, glass, paper, etc.). Pre-procedure 2026 completed – only participants of that pre-procedure can enter the bidding procedure mid-2026 (~€6bn)."}, "deadline": {"de": "Antragsfrist: 07.09.2026 (Gebotsverfahren 2026). Vorverfahren bereits abgeschlossen (01.12.2025).", "en": "Application deadline: 07 Sep 2026 (bidding procedure 2026). Pre-procedure already closed (01 Dec 2025)."}, "reference": {"de": "Förderrichtlinie CO₂-Differenzverträge (FRL CCfD) vom 04.05.2026. BMWE.", "en": "Funding directive CO₂ differential contracts (FRL CCfD) of 04 May 2026. Federal Ministry of Economic Affairs and Energy."}, "url": "https://www.bmwk.de/Redaktion/DE/Artikel/Industrie/klimaschutzvertraege.html", "applyUrl": "https://foerderportal.bund.de/easyonline/", "status": "frist-knapp", "tags": {"de": ["CCfD", "Klimaschutzverträge", "Großindustrie", "Wasserstoff", "Elektrifizierung", "CCU/CCS", "Stahl", "Chemie", "Zement"], "en": ["CCfD", "Climate protection contracts", "Heavy industry", "Hydrogen", "Electrification", "CCU/CCS", "Steel", "Chemicals", "Cement"]}, "source": "weitere", "verified": "20.05.2026"}, "bik": {"name": "BIK", "fullName": {"de": "Bundesförderung Industrie und Klimaschutz", "en": "Federal funding for Industry and Climate Protection"}, "content": {"de": "Förderung klimafreundlicher Investitions- und FuE-Vor pläne (M1), systemische Förderung (M2), Einzelmaßnahmen (M3), Betriebskostenförderung für Solarthermie/Wärmepumpen (M4).", "en": "Funding for transformation of existing and construction of new heat network systems. Four modules: transformation plans (M1), systemic funding (M2), individual measures (M3), operating-cost subsidies for solar thermal/heat pumps (M4)."}, "conditions": {"de": "Zuschüsse bis 50 % der förderfähigen Kosten für Investitionen in Neubau- und Bestandsnetze sowie für Einzelmaßnahmen, max. 100 Mio. €. M1 (Transformationspläne) bis 50 %, max. 5 Mio. €. Im Klimaschutzprogramm 2030 mit 400 Mio. € zusätzlich verstetigt.", "en": "Grants up to 50% of eligible costs for investments in new and existing networks and individual measures, max €100m. M1 (transformation plans) up to 50%, max €5m. In the 2030 Climate Protection Programme, additional €400m for continuation."}, "eligible": {"de": "Unternehmen, Kommunen, kommunale Eigenbetriebe, Zweckverbände, Vereine, Genossenschaften, Konsortien, Contractoren.", "en": "Companies, municipalities, municipal enterprises, special-purpose associations, associations, cooperatives, consortia, contractors."}, "deadline": {"de": "Laufend. Antragstellung bei BAFA. M1 zeitversetzt zu M2/3.", "en": "Ongoing. Application via BAFA. M1 staggered from M2/3."}, "reference": {"de": "BAnz AT 21.09.2022 B1 (Richtlinie für die Bundesförderung effiziente Wärmenetze).", "en": "BAnz AT 21 Sep 2022 B1 (Directive for federal funding of efficient heat networks)."}, "url": "https://www.bafa.de/DE/Energie/Effiziente_Gebaeude/Foerderprogramm_BEW/foerderprogramm_BEW_node.html", "applyUrl": "https://www.bafa.de/DE/Energie/Effiziente_Gebaeude/Foerderprogramm_BEW/foerderprogramm_BEW_node.html", "status": "aktiv", "tags": {"de": ["Wärmenetz", "Fernwärme", "BAFA", "Kommune", "Solarthermie", "Wärmepumpe", "Dekarbonisierung"], "en": ["Heat network", "District heating", "BAFA", "Municipality", "Solar thermal", "Heat pump", "Decarbonisation"]}, "source": "weitere", "verified": "20.05.2026"}, "beg": {"name": "BEG", "fullName": {"de": "Bundesförderung effiziente Gebäude (Wohngebäude, Nichtwohngebäude, Einzelmaßnahmen)", "en": "Federal funding for efficient buildings (residential, non-residential, individual measures)"}, "content": {"de": "Förderung der energetischen Sanierung und des effizienten Neubaus. Drei Programmlinien: Wohngebäude (BEG WG) und Nichtwohngebäude (BEG NWG) als Effizienzgebäude-Sanierung/-Neubau, und BEG EM für Einzelmaßnahmen (Heizungstausch, Hüllensanierung, Anlagentechnik). Heizungsförderung bei KfW (Wohngebäude) bzw. BAFA (EM).", "en": "Funding for energy-efficient renovation and efficient new construction. Three programme lines: residential (BEG WG) and non-residential buildings (BEG NWG) as efficiency building renovation/new construction, and BEG EM for individual measures (heating replacement, building envelope, system technology). Heating subsidy at KfW (residential) or BAFA (EM)."}, "conditions": {"de": "Zuschüsse 10–70 % je nach Maßnahme und Antragsteller. Effizienzhaus-Standards EH 40, 55, 70. Heizungstausch: bis 70 % (mit Klima-, Geschwindigkeits- und Einkommensbonus für Selbstnutzer). NWG: bis 17,5 % Tilgungszuschuss + ergänzende Programme 358/359.", "en": "Grants 10–70% depending on measure and applicant. Efficiency house standards EH 40, 55, 70. Heating replacement: up to 70% (with climate, speed, and income bonus for owner-occupiers). Non-residential: up to 17.5% repayment subsidy + supplementary programmes 358/359."}, "eligible": {"de": "Privatpersonen, WEG, Unternehmen, Kommunen, gemeinnützige Organisationen.", "en": "Private individuals, condominium owner associations, companies, municipalities, non-profit organisations."}, "deadline": {"de": "Laufend, separate Antragstellung je Programmlinie bei KfW oder BAFA.", "en": "Ongoing, separate application per programme line at KfW or BAFA."}, "reference": {"de": "BEG-Richtlinien BAnz AT (verschiedene Fassungen seit 2020); letzte Anpa let LANG = 'de';
let activeFilter = null;     // BL code or null
let activeProgId = null;     // currently expanded programme id
let activeProgScope = null;  // 'land' or 'bund'

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const t = (obj) => {
  if (obj == null) return '';
  if (typeof obj === 'string') return obj;
  if (obj[LANG] != null) return obj[LANG];
  if (obj.de != null) return obj.de;
  if (obj.en != null) return obj.en;
  return '';
};
const extIcon = '<svg class="ext-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
const chevDown = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

function renderUI(){
  document.documentElement.lang = LANG;
  $('pageTitle').textContent = t(DATA.ui.page_title);
  $('pageSub').textContent = t(DATA.ui.page_sub);
  $('pageStand').textContent = t(DATA.ui.page_stand) + ': ' + t(DATA.ui.page_date);

  $('faqTitle').textContent = t(DATA.ui.faq_section_title);
  $('faqSub').textContent  = t(DATA.ui.faq_section_sub);
  $('faqStartLabel').textContent = t(DATA.ui.faq_start_btn);

  $('filterBlLabel').textContent = t(DATA.ui.filter_bl_label);
  $('searchInput').placeholder = t(DATA.ui.search_placeholder);

  $('landTitle').textContent = t(DATA.ui.land_section_title);
  $('landSub').textContent  = t(DATA.ui.land_section_sub);
  $('bundTitle').textContent = t(DATA.ui.bund_section_title);
  $('bundSub').textContent  = t(DATA.ui.bund_section_intro);

  renderBlDropdown();
  renderActiveFilter();
  renderLandList();
  renderBundList();
  renderMapLegend();
  applyMapDensityColors();
  renderMapInfo();
  renderDisclaimer();
  renderFooter();
}

function renderBlDropdown(){
  const sel = $('blFilter');
  // Order BLs by translated name
  const entries = Object.entries(DATA.bundeslaender)
    .map(([code, bl]) => [code, t(bl)])
    .sort((a,b) => a[1].localeCompare(b[1], LANG));
  let html = '<option value="">' + esc(t(DATA.ui.filter_bl_all)) + '</option>';
  for (const [code, name] of entries){
    html += '<option value="' + code + '"' + (activeFilter === code ? ' selected' : '') + '>'
      + esc(name) + '</option>';
  }
  sel.innerHTML = html;
}

function renderActiveFilter(){
  const row = $('activeFilterRow');
  const txt = $('activeFilterText');
  if (!activeFilter){
    row.classList.add('hidden');
    txt.innerHTML = '';
    return;
  }
  row.classList.remove('hidden');
  const blName = t(DATA.bundeslaender[activeFilter]);
  txt.innerHTML = esc(t(DATA.ui.filter_active_label)) + ' '
    + '<span class="filter-chip">' + esc(blName)
    + '<span class="x" id="clearFilterBtn" title="' + esc(t(DATA.ui.filter_clear)) + '">×</span>'
    + '</span>';
  document.getElementById('clearFilterBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    setBlFilter(null);
  });
}

// =========================================================
// Land list
// =========================================================
function renderLandList(){
  const host = $('landList');
  const query = ($('searchInput').value || '').toLowerCase().trim();

  // Build filtered+sorted list
  let entries = Object.entries(DATA.land_foerderungen);
  if (activeFilter){
    entries = entries.filter(([id,p]) => p.bundesland === activeFilter);
  }
  if (query){
    entries = entries.filter(([id,p]) => matches(p, query, false));
  }
  // Sort: by BL name, then by name
  entries.sort((a,b) => {
    const blA = t(DATA.bundeslaender[a[1].bundesland]);
    const blB = t(DATA.bundeslaender[b[1].bundesland]);
    if (blA !== blB) return blA.localeCompare(blB, LANG);
    return a[1].name.localeCompare(b[1].name, LANG);
  });

  if (!entries.length){
    host.innerHTML = '<div class="no-match">' + esc(LANG==='de' ? 'Keine passenden Landesförderungen.' : 'No matching state programmes.') + '</div>';
    return;
  }

  let html = '';
  for (const [id, p] of entries){
    html += renderProgItem(id, p, 'land');
  }
  host.innerHTML = html;
  attachProgItemListeners(host, 'land');
}

// =========================================================
// Bund list (below land)
// =========================================================
function renderBundList(){
  const host = $('bundList');
  const query = ($('searchInput').value || '').toLowerCase().trim();
  // BL filter: bund programmes are nationwide, so they STAY visible
  // but we slightly indicate "applies in your selected state too"
  let entries = Object.entries(DATA.bund_foerderungen);
  if (query){
    entries = entries.filter(([id,p]) => matches(p, query, true));
  }

  if (!entries.length){
    host.innerHTML = '<div class="no-match">' + esc(LANG==='de' ? 'Keine passenden Bundesförderungen.' : 'No matching federal programmes.') + '</div>';
    return;
  }

  let html = '';
  for (const [id, p] of entries){
    html += renderProgItem(id, p, 'bund');
  }
  host.innerHTML = html;
  attachProgItemListeners(host, 'bund');
}

function renderProgItem(id, p, scope){
  const fill = DATA.prog_status_fill[p.status] || DATA.ci.green;
  const lbl = t(DATA.prog_status_labels[p.status] || {});
  const isActive = (id === activeProgId && scope === activeProgScope);

  let subtitle = '';
  if (scope === 'land'){
    const blName = t(DATA.bundeslaender[p.bundesland]);
    subtitle = esc(blName);
  } else {
    subtitle = esc(LANG === 'de' ? 'Bundesweit · alle 16 Länder' : 'Nationwide · all 16 states');
  }

  let html = '<div class="prog-item' + (isActive ? ' active' : '') + '" data-id="' + esc(id) + '" data-scope="' + scope + '">';
  html += '<div class="prog-header">'
    + '<div class="ph-left">'
    +   '<div class="ph-text">'
    +     '<div class="pname">' + esc(p.name) + '</div>'
    +     '<div class="pbl">' + subtitle + '</div>'
    +   '</div>'
    + '</div>'
    + '<span class="prog-pill" style="background:' + fill + '">' + esc(lbl) + '</span>'
    + chevDown
    + '</div>';

  if (isActive){
    html += renderInlineDetail(id, p, scope);
  }
  html += '</div>';
  return html;
}

function renderInlineDetail(id, p, scope){
  const scopeBadgeText = (scope === 'bund')
    ? t(DATA.ui.lbl_bund_scope)
    : t(DATA.ui.lbl_land_scope) + ' · ' + t(DATA.bundeslaender[p.bundesland]);
  const scopeClass = (scope === 'bund') ? 'scope-bund' : 'scope-land';
  const sourceBadge = p.source === 'katalog'
    ? '<span class="source-badge source-katalog">' + esc(t(DATA.ui.badge_katalog)) + '</span>'
    : '<span class="source-badge source-weitere">' + esc(t(DATA.ui.badge_weitere)) + '</span>';

  const tags = (p.tags && p.tags[LANG]) ? p.tags[LANG] : (p.tags && p.tags.de ? p.tags.de : []);

  let html = '<div class="prog-detail">';
  html += '<div class="pd-head">'
    + '<p class="full">' + esc(t(p.fullName)) + '</p>'
    + '<div class="pd-badges">'
    +   '<span class="scope-badge ' + scopeClass + '">' + esc(scopeBadgeText) + '</span>'
    +   sourceBadge
    + '</div>'
    + '</div>';

  html += sectionRow('sec_content', p.content);
  html += sectionRow('sec_conditions', p.conditions);
  html += sectionRow('sec_eligible', p.eligible);
  html += sectionRow('sec_deadline', p.deadline);
  html += sectionRow('sec_reference', p.reference);

  if (tags && tags.length){
    html += '<div class="pd-sec"><div class="lbl">' + esc(t(DATA.ui.sec_tags)) + '</div>'
      + '<div class="pd-tags">' + tags.map(x => '<span class="pd-tag">' + esc(x) + '</span>').join('') + '</div></div>';
  }

  html += '<div class="pd-actions">';
  if (p.url) html += '<a class="btn btn-secondary" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + extIcon + esc(t(DATA.ui.btn_visit_site)) + '</a>';
  if (p.applyUrl) html += '<a class="btn btn-primary" href="' + esc(p.applyUrl) + '" target="_blank" rel="noopener">' + extIcon + esc(t(DATA.ui.btn_apply)) + '</a>';
  html += '<div class="cozwei-cta">'
       + '<a class="btn btn-cozwei" href="' + esc(t(DATA.ui.booking_url)) + '" target="_blank" rel="noopener">'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" style="margin-right:5px"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
       + esc(t(DATA.ui.btn_booking)) + '</a>'
       + '<span class="cta-hint">' + esc(t(DATA.ui.btn_booking_hint)) + '</span>'
       + '</div>';
  html += '</div>';

  if (p.verified){
    html += '<div class="pd-verified">' + esc(t(DATA.ui.verified_label)) + ': ' + esc(p.verified) + '</div>';
  }

  html += '</div>';
  return html;
}

function sectionRow(uiKey, val){
  const tx = t(val);
  if (!tx) return '';
  return '<div class="pd-sec"><div class="lbl">' + esc(t(DATA.ui[uiKey])) + '</div><div class="txt">' + esc(tx) + '</div></div>';
}

function attachProgItemListeners(host, scope){
  host.querySelectorAll('.prog-item').forEach(item => {
    const header = item.querySelector('.prog-header');
    header.addEventListener('click', (e) => {
      if (e.target.closest('a')) return; // don't trigger when clicking action buttons
      const id = item.getAttribute('data-id');
      const sc = item.getAttribute('data-scope');
      toggleProgram(id, sc);
    });
  });
}

function toggleProgram(id, scope){
  if (activeProgId === id && activeProgScope === scope){
    // collapse
    activeProgId = null;
    activeProgScope = null;
    if (scope === 'land') resetMapHighlight();
  } else {
    activeProgId = id;
    activeProgScope = scope;
    if (scope === 'land'){
      const p = DATA.land_foerderungen[id];
      highlightSingleBL(p.bundesland, p.status);
    } else {
      // bund - keep current map state (no highlight change)
      resetMapHighlight();
    }
  }
  // Re-render the affected list
  if (scope === 'land') renderLandList();
  else renderBundList();
  renderMapInfo();

  // Scroll active item into view (smooth, small offset)
  setTimeout(() => {
    const activeEl = document.querySelector('.prog-item.active');
    if (activeEl){
      const rect = activeEl.getBoundingClientRect();
      const isVisible = rect.top >= 60 && rect.bottom <= window.innerHeight - 20;
      if (!isVisible){
        activeEl.scrollIntoView({behavior:'smooth', block:'start'});
        window.scrollBy(0, -60);
      }
    }
  }, 80);
}

function matches(p, q, isBund){
  if (p.name && p.name.toLowerCase().includes(q)) return true;
  if (t(p.fullName).toLowerCase().includes(q)) return true;
  if (t(p.content).toLowerCase().includes(q)) return true;
  if (t(p.conditions).toLowerCase().includes(q)) return true;
  if (t(p.eligible).toLowerCase().includes(q)) return true;
  if (t(p.deadline).toLowerCase().includes(q)) return true;
  if (t(p.reference).toLowerCase().includes(q)) return true;
  if (p.tags){
    const all = Object.values(p.tags).flat();
    if (all.some(tag => String(tag).toLowerCase().includes(q))) return true;
  }
  if (!isBund && p.bundesland){
    const bl = DATA.bundeslaender[p.bundesland];
    if (bl){
      if (String(p.bundesland).toLowerCase().includes(q)) return true;
      if (t(bl).toLowerCase().includes(q)) return true;
    }
  }
  return false;
}

// =========================================================
// Förderungsfinder Quiz
// =========================================================
let quizState = { step: -1, answers: {} };  // step -1 = closed

function openQuiz(){
  quizState = { step: 0, answers: {} };
  $('faqQuiz').classList.add('open');
  renderQuiz();
}

function closeQuiz(){
  quizState.step = -1;
  $('faqQuiz').classList.remove('open');
  $('faqQuiz').innerHTML = '';
}

function renderQuiz(){
  const host = $('faqQuiz');
  const questions = DATA.questions;
  const total = questions.length;
  const step = quizState.step;

  if (step === total){
    renderQuizResults();
    return;
  }

  const q = questions[step];
  const selected = quizState.answers[q.id] || [];
  const isMulti = q.type === 'multi_select';
  const pct = Math.round((step / total) * 100);

  let html = '<div class="quiz-progress">'
    + '<span>' + esc(t(DATA.ui.faq_progress).replace('{current}', step+1).replace('{total}', total)) + '</span>'
    + '<div class="step-bar"><div class="step-bar-fill" style="width:' + pct + '%"></div></div>'
    + '<button class="quiz-close" id="quizCloseBtn">' + esc(t(DATA.ui.faq_close_btn)) + '</button>'
    + '</div>';

  html += '<h3 class="quiz-question">' + esc(t(q.question)) + '</h3>';
  if (q.hint) html += '<p class="quiz-hint">' + esc(t(q.hint)) + (isMulti ? ' · ' + esc(t(DATA.ui.faq_multi_hint)) : '') + '</p>';

  html += '<div class="quiz-options">';
  for (const opt of q.options){
    const isSel = selected.includes(opt.id);
    const chkClass = isMulti ? 'chk' : 'chk radio';
    html += '<button class="quiz-option' + (isSel ? ' selected' : '') + '" data-opt="' + esc(opt.id) + '">'
      + '<span class="' + chkClass + '"></span>'
      + '<span>' + esc(t(opt.label)) + '</span>'
      + '</button>';
  }
  html += '</div>';

  // Navigation
  const canProceed = selected.length > 0;
  const isLast = step === total - 1;
  html += '<div class="quiz-nav">'
    + '<div class="quiz-nav-left">';
  if (step > 0){
    html += '<button class="btn-quiz btn-quiz-secondary" id="quizBackBtn">← ' + esc(t(DATA.ui.faq_back_btn)) + '</button>';
  }
  html += '</div>'
    + '<div class="quiz-nav-right">'
    + '<button class="btn-quiz btn-quiz-primary" id="quizNextBtn"' + (canProceed ? '' : ' disabled') + '>'
    + (isLast ? esc(t(DATA.ui.faq_results_btn)) : esc(t(DATA.ui.faq_next_btn)) + ' →')
    + '</button>'
    + '</div>'
    + '</div>';

  host.innerHTML = html;
  attachQuizListeners(q, isMulti);
}

function attachQuizListeners(q, isMulti){
  // Option clicks
  document.querySelectorAll('#faqQuiz .quiz-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const optId = btn.getAttribute('data-opt');
      const cur = quizState.answers[q.id] || [];
      let next;
      if (isMulti){
        // 'none' toggles others off; selecting any other toggles 'none' off
        if (optId === 'none'){
          next = cur.includes('none') ? [] : ['none'];
        } else if (cur.includes(optId)){
          next = cur.filter(x => x !== optId);
        } else {
          next = cur.filter(x => x !== 'none').concat([optId]);
        }
      } else {
        next = [optId];
      }
      quizState.answers[q.id] = next;
      renderQuiz();
    });
  });
  // Back
  const back = $('quizBackBtn');
  if (back) back.addEventListener('click', () => {
    quizState.step = Math.max(0, quizState.step - 1);
    renderQuiz();
  });
  // Next
  const next = $('quizNextBtn');
  if (next) next.addEventListener('click', () => {
    quizState.step += 1;
    renderQuiz();
  });
  // Close
  const closeBtn = $('quizCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', closeQuiz);
}

// ----- Rule evaluator -----
function evalRule(rule, answers){
  // returns {match: bool, triggers: [{qid, optId}]}
  if (rule.op === 'in'){
    const userVals = answers[rule.qid] || [];
    const overlap = userVals.filter(v => rule.values.includes(v));
    if (overlap.length === 0) return {match:false, triggers:[]};
    return {match:true, triggers: overlap.map(v => ({qid: rule.qid, optId: v}))};
  }
  if (rule.op === 'and'){
    let all = [];
    for (const child of rule.rules){
      const r = evalRule(child, answers);
      if (!r.match) return {match:false, triggers:[]};
      all = all.concat(r.triggers);
    }
    return {match:true, triggers:all};
  }
  if (rule.op === 'or'){
    let any = [];
    let matched = false;
    for (const child of rule.rules){
      const r = evalRule(child, answers);
      if (r.match){ matched = true; any = any.concat(r.triggers); }
    }
    return {match:matched, triggers:any};
  }
  return {match:false, triggers:[]};
}

function findOptionLabel(qid, optId){
  const q = DATA.questions.find(x => x.id === qid);
  if (!q) return optId;
  const o = q.options.find(x => x.id === optId);
  return o ? t(o.label) : optId;
}

// Build the personalised "Why this fits you" rows shown on each result card.
// Uses triggers (questionId+optionId pairs from the matched rule) so each row
// references an actual user answer that caused this programme to surface.
function buildPersonalReasonRows(triggers){
  // Group triggers by question id, preserve user-facing order
  const order = ['standort','organisation','vorhaben','branche','prioritaet'];
  const labelKey = {
    'standort': 'faq_pc_standort',
    'organisation': 'faq_pc_organisation',
    'vorhaben': 'faq_pc_vorhaben',
    'branche': 'faq_pc_branche',
    'prioritaet': 'faq_pc_prioritaet',
  };
  const byQ = {};
  for (const tr of triggers){
    if (!byQ[tr.qid]) byQ[tr.qid] = [];
    let lbl = findOptionLabel(tr.qid, tr.optId);
    // Friendlier "multi" wording
    if (tr.qid === 'standort' && tr.optId === 'multi'){
      lbl = t(DATA.ui.faq_pc_multi);
    }
    byQ[tr.qid].push(lbl);
  }
  let rows = '';
  for (const qid of order){
    if (!byQ[qid] || !byQ[qid].length) continue;
    const key = labelKey[qid];
    const head = t(DATA.ui[key]);
    rows += '<li><span class="pc-key">' + esc(head) + ':</span> '
      +     '<span class="pc-val">' + esc(byQ[qid].join(', ')) + '</span></li>';
  }
  return rows;
}

function evaluateRules(){
  // Returns {high:[{rule, prog, triggers}], medium:[...]}
  const out = { high: [], medium: [] };
  const seen = new Set();  // dedupe by pid+confidence
  for (const rule of DATA.rules){
    const r = evalRule(rule.when, quizState.answers);
    if (!r.match) continue;
    const key = rule.pid + ':' + rule.confidence;
    if (seen.has(key)) continue;
    seen.add(key);
    const prog = rule.scope === 'bund' ? DATA.bund_foerderungen[rule.pid] : DATA.land_foerderungen[rule.pid];
    if (!prog) continue;
    // Deduplicate triggers
    const uniq = [];
    const k = new Set();
    for (const tr of r.triggers){
      const kk = tr.qid + '::' + tr.optId;
      if (k.has(kk)) continue;
      k.add(kk);
      uniq.push(tr);
    }
    out[rule.confidence].push({ rule, prog, scope: rule.scope, triggers: uniq });
  }
  // Drop medium entries if same pid already in high
  const highPids = new Set(out.high.map(x => x.rule.pid));
  out.medium = out.medium.filter(x => !highPids.has(x.rule.pid));
  return out;
}

function renderQuizResults(){
  const host = $('faqQuiz');
  const grouped = evaluateRules();

  // Header + answer summary
  let html = '<div class="quiz-progress">'
    + '<span>' + esc(t(DATA.ui.faq_results_title)) + '</span>'
    + '<div class="step-bar"><div class="step-bar-fill" style="width:100%"></div></div>'
    + '<button class="quiz-close" id="quizCloseBtn">' + esc(t(DATA.ui.faq_close_btn)) + '</button>'
    + '</div>';

  html += '<h3 class="quiz-results-header">' + esc(t(DATA.ui.faq_results_title)) + '</h3>';
  html += '<p class="quiz-results-sub">' + esc(t(DATA.ui.faq_results_sub)) + '</p>';

  // Answer chips
  html += '<div class="quiz-answer-chips">';
  for (const q of DATA.questions){
    const sel = quizState.answers[q.id] || [];
    if (!sel.length) continue;
    const labels = sel.map(o => findOptionLabel(q.id, o)).join(', ');
    html += '<span class="answer-chip"><span class="qlabel">' + esc(t(q.question).split('?')[0].split('(')[0].trim().slice(0,28)) + ':</span>' + esc(labels) + '</span>';
  }
  html += '</div>';

  // Tiers
  for (const tier of ['high', 'medium']){
    const list = grouped[tier];
    if (!list.length) continue;
    const tierLbl = tier === 'high' ? t(DATA.ui.faq_results_high) : t(DATA.ui.faq_results_medium);
    html += '<div class="results-tier ' + tier + '">';
    html += '<div class="results-tier-h"><span class="dot"></span><span>' + esc(tierLbl) + ' · ' + list.length + '</span></div>';
    html += '<div class="results-grid">';
    for (const m of list){
      const scopeName = m.scope === 'bund' ? t(DATA.ui.lbl_bund_scope) : t(DATA.bundeslaender[m.prog.bundesland]);
      const personalRows = buildPersonalReasonRows(m.triggers);
      html += '<div class="result-card">'
        + '<div class="result-card-h">'
        +   '<div class="name">' + esc(m.prog.name) + '</div>'
        +   '<span class="scope-pill ' + m.scope + '">' + esc(m.scope === 'bund' ? (LANG==='de'?'Bund':'Federal') : (LANG==='de'?'Land':'State')) + '</span>'
        + '</div>'
        + '<div style="font-size:11.5px;color:var(--muted);margin-bottom:8px">' + esc(scopeName) + '</div>'
        + '<div class="personal-context">'
        +   '<div class="pc-title">' + esc(t(DATA.ui.faq_personal_title)) + '</div>'
        +   '<ul class="pc-list">' + personalRows + '</ul>'
        + '</div>'
        + '<div class="rule-reason">'
        +   '<div class="rr-title">' + esc(t(DATA.ui.faq_program_context)) + '</div>'
        +   '<p>' + esc(t(m.rule.reason)) + '</p>'
        + '</div>'
        + '<button class="open-detail" data-pid="' + esc(m.rule.pid) + '" data-scope="' + m.scope + '">'
        +   esc(t(DATA.ui.faq_view_detail_btn)) + ' →'
        + '</button>'
        + '</div>';
    }
    html += '</div></div>';
  }

  if (!grouped.high.length && !grouped.medium.length){
    html += '<div class="results-empty">' + esc(t(DATA.ui.faq_results_none)) + '</div>';
  }

  // Footer actions
  html += '<div class="quiz-nav" style="margin-top:6px">'
    + '<div class="quiz-nav-left">'
    +   '<button class="btn-quiz btn-quiz-secondary" id="quizRestartBtn">↻ ' + esc(t(DATA.ui.faq_restart_btn)) + '</button>'
    + '</div>'
    + '<div class="quiz-nav-right">'
    +   '<button class="btn-quiz btn-quiz-primary" id="quizCloseBtnFooter">' + esc(t(DATA.ui.faq_close_btn)) + '</button>'
    + '</div>'
    + '</div>';

  host.innerHTML = html;

  // Listeners
  document.querySelectorAll('#faqQuiz .open-detail').forEach(b => {
    b.addEventListener('click', () => {
      const pid = b.getAttribute('data-pid');
      const sc  = b.getAttribute('data-scope');

      // 1. Set programme state FIRST (before any render that might wipe it)
      activeProgId = pid;
      activeProgScope = sc;

      // 2. Set BL filter inline (don't use setBlFilter – it resets activeProgId)
      if (sc === 'land'){
        const p = DATA.land_foerderungen[pid];
        if (p) activeFilter = p.bundesland;
        highlightSingleBL(p.bundesland, p.status);
      } else {
        activeFilter = null;
        resetMapHighlight();
      }

      // 3. Close quiz so the user clearly sees the programme detail
      closeQuiz();

      // 4. Re-render lists + filter + map info with the new state
      renderBlDropdown();
      renderActiveFilter();
      renderLandList();
      renderBundList();
      renderMapInfo();

      // 5. Smooth scroll to the expanded item with comfortable offset
      setTimeout(() => {
        const el = document.querySelector('.prog-item.active');
        if (el){
          const y = el.getBoundingClientRect().top + window.scrollY - 90;
          window.scrollTo({top: y, behavior: 'smooth'});
        }
      }, 180);
    });
  });
  const cb = $('quizCloseBtn'); if (cb) cb.addEventListener('click', closeQuiz);
  const cbf = $('quizCloseBtnFooter'); if (cbf) cbf.addEventListener('click', closeQuiz);
  const rb = $('quizRestartBtn'); if (rb) rb.addEventListener('click', openQuiz);
}
